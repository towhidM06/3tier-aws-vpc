<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="Arial, sans-serif" font-size="14">
  <rect width="900" height="640" fill="#ffffff"/>
  <text x="450" y="28" text-anchor="middle" font-size="20" font-weight="bold">3-Tier App on Custom AWS VPC (us-east-1)</text>

  <ellipse cx="450" cy="75" rx="70" ry="22" fill="#e8f0fe" stroke="#1a73e8"/>
  <text x="450" y="80" text-anchor="middle">Internet</text>
  <line x1="450" y1="97" x2="450" y2="130" stroke="#333" stroke-width="2"/>

  <rect x="20" y="115" width="860" height="500" rx="10" fill="none" stroke="#e8710a" stroke-width="2" stroke-dasharray="6"/>
  <text x="35" y="137" fill="#e8710a" font-weight="bold">VPC: todo-vpc-vpc (10.0.0.0/16)</text>

  <rect x="370" y="145" width="160" height="30" rx="4" fill="#fff3e0" stroke="#e8710a"/>
  <text x="450" y="165" text-anchor="middle">Internet Gateway</text>
  <line x1="450" y1="175" x2="450" y2="205" stroke="#333" stroke-width="2"/>

  <rect x="40" y="200" width="820" height="120" rx="8" fill="#e6f4ea" stroke="#188038"/>
  <text x="55" y="220" fill="#188038" font-weight="bold">Public subnet (route 0.0.0.0/0 to IGW)</text>
  <rect x="330" y="235" width="240" height="70" rx="6" fill="#ffffff" stroke="#188038" stroke-width="2"/>
  <text x="450" y="258" text-anchor="middle" font-weight="bold">todo-web-server</text>
  <text x="450" y="277" text-anchor="middle">Nginx: web, proxy, HTTPS, LB</text>
  <text x="450" y="295" text-anchor="middle" font-size="12">SG: todo-web-sg | 80, 443</text>
  <rect x="650" y="240" width="190" height="60" rx="6" fill="#fff3e0" stroke="#e8710a"/>
  <text x="745" y="265" text-anchor="middle">NAT Gateway</text>
  <text x="745" y="284" text-anchor="middle" font-size="12">outbound only for private</text>

  <line x1="450" y1="305" x2="450" y2="350" stroke="#333" stroke-width="2"/>
  <text x="460" y="335" font-size="12">:5000</text>

  <rect x="40" y="345" width="820" height="130" rx="8" fill="#fef7e0" stroke="#f9ab00"/>
  <text x="55" y="365" fill="#b06000" font-weight="bold">Private subnet 1 - App tier (route 0.0.0.0/0 to NAT)</text>
  <rect x="150" y="380" width="250" height="80" rx="6" fill="#ffffff" stroke="#f9ab00" stroke-width="2"/>
  <text x="275" y="405" text-anchor="middle" font-weight="bold">todo-app-server-1</text>
  <text x="275" y="424" text-anchor="middle">Flask + Gunicorn :5000</text>
  <text x="275" y="445" text-anchor="middle" font-size="12">SG: todo-app-sg | 10.0.140.222</text>
  <rect x="500" y="380" width="250" height="80" rx="6" fill="#ffffff" stroke="#f9ab00" stroke-width="2"/>
  <text x="625" y="405" text-anchor="middle" font-weight="bold">todo-app-server-2</text>
  <text x="625" y="424" text-anchor="middle">Flask + Gunicorn :5000</text>
  <text x="625" y="445" text-anchor="middle" font-size="12">SG: todo-app-sg | 10.0.131.163</text>

  <line x1="275" y1="460" x2="400" y2="505" stroke="#333" stroke-width="2"/>
  <line x1="625" y1="460" x2="500" y2="505" stroke="#333" stroke-width="2"/>
  <text x="450" y="495" text-anchor="middle" font-size="12">:3306</text>

  <rect x="40" y="500" width="820" height="100" rx="8" fill="#fce8e6" stroke="#d93025"/>
  <text x="55" y="520" fill="#d93025" font-weight="bold">Private subnet 2 - DB tier (route 0.0.0.0/0 to NAT)</text>
  <rect x="330" y="530" width="240" height="60" rx="6" fill="#ffffff" stroke="#d93025" stroke-width="2"/>
  <text x="450" y="552" text-anchor="middle" font-weight="bold">todo-db-server (MySQL)</text>
  <text x="450" y="572" text-anchor="middle" font-size="12">SG: todo-db-sg | 10.0.145.143</text>
</svg>
