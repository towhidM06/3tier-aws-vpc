upstream todo_backend {
    server 10.0.140.222:5000;   # todo-app-server-1
    server 10.0.131.163:5000;   # todo-app-server-2
}

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;
    ssl_certificate     /etc/ssl/certs/todo.crt;
    ssl_certificate_key /etc/ssl/private/todo.key;

    root /var/www/todo;
    index index.html;

    location / { try_files $uri $uri/ =404; }

    location /api/ {
        proxy_pass http://todo_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
